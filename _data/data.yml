career-profile:
  title: Career Summary
  summary: |
    Senior Microsoft Dynamics 365 / Power Platform Developer with 16+ years of hands-on experience designing, 
    customizing and integrating enterprise CRM solutions. Since 2016 I have led Dynamics 365 development 
    for the Israel Courts Administration, building heavy systems from vanilla, introducing Git-based 
    workflows and streamlining case-management for thousands of end-users. Deep expertise in C#, .NET, 
    Dataverse, SQL Server, HTML5/JavaScript; certified Microsoft Specialist in 
    Extending Dynamics CRM 2013, Customization & Configuration (2013). 
    Known for clean architecture, performance tuning and mentoring teams to deliver secure, 
    maintainable code that powers mission-critical government processes.
    Comfortable using AI coding assistants to accelerate routine tasks while keeping architecture and critical code under human control.

